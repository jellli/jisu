<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>极速 · 下载管理器</title>
    <link rel="stylesheet" href="styles.css">
    <script src="bridge.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="icon-brand" viewBox="0 0 24 24">
        <path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/>
        <path d="M4 5h3M3 9h2"/>
      </symbol>
      <symbol id="icon-grid" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="6" height="6" rx="1.3"/><rect x="14.5" y="3.5" width="6" height="6" rx="1.3"/>
        <rect x="3.5" y="14.5" width="6" height="6" rx="1.3"/><rect x="14.5" y="14.5" width="6" height="6" rx="1.3"/>
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24">
        <path d="M12 3.5v12m-4.5-4.5 4.5 4.5 4.5-4.5M4.5 16v3a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-3"/>
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3 1.5"/>
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/>
      </symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24">
        <path d="M9 5v14m6-14v14"/>
      </symbol>
      <symbol id="icon-alert" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5m0 3.5h.01"/>
      </symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24">
        <path d="M4 7h7m4 0h5M4 12h3m4 0h9M4 17h10m4 0h2"/>
        <circle cx="13" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="16" cy="17" r="2"/>
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"/>
      </symbol>
      <symbol id="icon-link" viewBox="0 0 24 24">
        <path d="m10 8 3.2-3.2a4.2 4.2 0 0 1 6 6L16 14M8 10l-3.2 3.2a4.2 4.2 0 0 0 6 6L14 16m-5-1 6-6"/>
      </symbol>
      <symbol id="icon-folder" viewBox="0 0 24 24">
        <path d="M3.5 7a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>
      </symbol>
      <symbol id="icon-speed" viewBox="0 0 24 24">
        <path d="M5 19a9 9 0 1 1 14 0zM12 15l4-4"/><circle cx="12" cy="15" r="1"/>
      </symbol>
      <symbol id="icon-inbox" viewBox="0 0 24 24">
        <path d="m3.5 13 3-7h11l3 7v4a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>
        <path d="M4 13h5l1 2h4l1-2h5"/>
      </symbol>
      <symbol id="icon-file" viewBox="0 0 24 24">
        <path d="M13.5 4.5H7a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10zm0 0v5.5H19M9 14h6"/>
      </symbol>
      <symbol id="icon-play" viewBox="0 0 24 24">
        <path d="m9 5.5 9 6.5-9 6.5z"/>
      </symbol>
      <symbol id="icon-retry" viewBox="0 0 24 24">
        <path d="M19.8 10a8 8 0 1 0-.8 6.5M20 5.5V10h-4.5"/>
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <path d="M4.5 7h15M9 7V4.5h6V7m3 0-1 12h-10L6 7m4 4v4.5m4-4.5v4.5"/>
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M18 6 6 18"/>
      </symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#icon-brand"></use></svg></span>
          <div class="brand-copy"><strong>极速</strong><span>Jisu 下载管理器</span></div>
        </div>

        <nav class="filters" aria-labelledby="filters-label">
          <h2 id="filters-label" class="sidebar-label">任务视图</h2>
          <button class="filter" type="button" data-filter="all" aria-pressed="true" aria-label="全部任务" title="全部任务">
            <svg class="icon" aria-hidden="true"><use href="#icon-grid"></use></svg><span class="filter-label">全部任务</span><span class="filter-count" aria-hidden="true">0</span>
          </button>
          <button class="filter" type="button" data-filter="downloading" aria-pressed="false" aria-label="下载中" title="下载中">
            <svg class="icon" aria-hidden="true"><use href="#icon-download"></use></svg><span class="filter-label">下载中</span><span class="filter-count" aria-hidden="true">0</span>
          </button>
          <button class="filter" type="button" data-filter="queued" aria-pressed="false" aria-label="排队中" title="排队中">
            <svg class="icon" aria-hidden="true"><use href="#icon-clock"></use></svg><span class="filter-label">排队中</span><span class="filter-count" aria-hidden="true">0</span>
          </button>
          <button class="filter" type="button" data-filter="completed" aria-pressed="false" aria-label="已完成" title="已完成">
            <svg class="icon" aria-hidden="true"><use href="#icon-check"></use></svg><span class="filter-label">已完成</span><span class="filter-count" aria-hidden="true">0</span>
          </button>
          <button class="filter" type="button" data-filter="paused" aria-pressed="false" aria-label="已暂停" title="已暂停">
            <svg class="icon" aria-hidden="true"><use href="#icon-pause"></use></svg><span class="filter-label">已暂停</span><span class="filter-count" aria-hidden="true">0</span>
          </button>
          <button class="filter" type="button" data-filter="failed" aria-pressed="false" aria-label="下载失败" title="下载失败">
            <svg class="icon" aria-hidden="true"><use href="#icon-alert"></use></svg><span class="filter-label">下载失败</span><span class="filter-count" aria-hidden="true">0</span>
          </button>
        </nav>

        <div class="sidebar-storage">
          <svg class="icon" aria-hidden="true"><use href="#icon-folder"></use></svg>
          <div><span>默认保存位置</span><strong id="sidebar-directory">—</strong></div>
        </div>
      </aside>

      <main class="workspace">
        <header class="workspace-header">
          <div>
            <h1>下载中心</h1>
            <p>添加链接，跟踪并管理文件下载。</p>
          </div>
          <button id="open-settings" class="button button-secondary" type="button" aria-haspopup="dialog" disabled>
            <svg class="icon" aria-hidden="true"><use href="#icon-settings"></use></svg>设置
          </button>
        </header>

        <section class="panel composer" aria-labelledby="composer-title">
          <div class="composer-heading">
            <h2 id="composer-title">新建下载</h2><span class="protocol">HTTP / HTTPS</span>
          </div>
          <form id="download-form" novalidate>
            <div class="composer-fields">
              <label class="url-field">
                <svg class="icon" aria-hidden="true"><use href="#icon-link"></use></svg>
                <span class="sr-only">下载链接</span>
                <input id="download-url" aria-describedby="download-error" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="粘贴文件下载链接">
              </label>
              <button id="add-download" class="button button-primary" type="submit" disabled>
                <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>添加下载
              </button>
            </div>
            <p class="inline-error" id="download-error" role="alert" hidden></p>
          </form>
        </section>

        <section class="metrics" aria-label="下载概况">
          <div class="panel metric">
            <span class="metric-icon speed-icon"><svg class="icon" aria-hidden="true"><use href="#icon-speed"></use></svg></span>
            <div><span class="metric-label">实时下载速度</span><strong id="metric-speed">0 B/s</strong></div>
          </div>
          <div class="panel metric">
            <span class="metric-icon active-icon"><svg class="icon" aria-hidden="true"><use href="#icon-download"></use></svg></span>
            <div><span class="metric-label">下载中</span><strong id="metric-active">0</strong></div>
          </div>
          <div class="panel metric">
            <span class="metric-icon complete-icon"><svg class="icon" aria-hidden="true"><use href="#icon-check"></use></svg></span>
            <div><span class="metric-label">已完成</span><strong id="metric-completed">0</strong></div>
          </div>
        </section>

        <section class="panel tasks" aria-labelledby="tasks-title">
          <header class="tasks-heading">
            <h2 id="tasks-title" tabindex="-1">全部任务</h2><span id="tasks-count" class="task-count">0 项</span>
          </header>
          <div id="task-columns" class="task-columns task-grid" aria-hidden="true" hidden>
            <span>文件</span><span>状态与进度</span><span>速度与连接</span><span>操作</span>
          </div>
          <ul id="task-list" class="task-list" aria-label="下载任务" hidden></ul>
          <div class="empty" id="empty-state">
            <span class="empty-icon"><svg class="icon" aria-hidden="true"><use href="#icon-inbox"></use></svg></span>
            <h3 id="empty-title">正在读取下载任务…</h3>
            <p id="empty-description"></p>
          </div>
        </section>

        <p class="notice" id="notice" role="status" aria-atomic="true"></p>
      </main>
    </div>

    <template id="task-template">
      <li class="task-row task-grid">
        <div class="task-file">
          <span class="file-icon"><svg class="icon" aria-hidden="true"><use href="#icon-file"></use></svg></span>
          <div class="task-file-details">
            <strong class="task-name"></strong>
            <span class="task-source"></span>
            <span class="task-error" hidden></span>
          </div>
        </div>
        <div class="task-progress">
          <div class="progress-labels"><span class="task-state"></span><span class="task-percentage"></span></div>
          <progress max="1" aria-label="下载进度"></progress>
          <span class="task-size"></span>
        </div>
        <div class="task-transfer">
          <span class="task-speed"></span><span class="task-connections"></span>
        </div>
        <div class="task-actions">
          <button class="icon-button task-primary" type="button" hidden>
            <svg class="icon" aria-hidden="true"><use href="#icon-pause"></use></svg>
          </button>
          <button class="icon-button danger-button task-remove" type="button" aria-label="移除任务" title="移除任务">
            <svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg>
          </button>
        </div>
      </li>
    </template>

    <dialog id="settings-dialog" role="dialog" aria-labelledby="settings-title">
      <header class="dialog-header">
        <div><h2 id="settings-title">下载设置</h2><p>管理保存位置和同时下载的任务数。</p></div>
        <button id="close-settings" class="icon-button" type="button" aria-label="关闭设置" title="关闭">
          <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
        </button>
      </header>
      <section class="setting">
        <h3>默认保存位置</h3>
        <p>新下载的文件将保存到此文件夹。</p>
        <div class="directory-field">
          <span id="settings-directory">—</span>
          <button id="choose-directory" class="button button-secondary" type="button">选择文件夹</button>
        </div>
      </section>
      <section class="setting setting-inline">
        <div><label for="concurrency">同时下载数</label><p id="concurrency-help">超出上限的任务会自动排队。</p></div>
        <select id="concurrency" aria-describedby="concurrency-help">
          <option value="1">1 项</option>
          <option value="2">2 项</option>
          <option value="3">3 项</option>
          <option value="4">4 项</option>
          <option value="5">5 项</option>
        </select>
      </section>
      <p id="settings-error" class="inline-error" role="alert" hidden></p>
    </dialog>

    <dialog id="remove-dialog" role="dialog" aria-labelledby="remove-title" aria-describedby="remove-note">
      <header class="dialog-header">
        <div><h2 id="remove-title">移除下载任务？</h2><p id="remove-name" class="remove-name"></p></div>
      </header>
      <p id="remove-note"></p>
      <div class="dialog-actions">
        <button id="cancel-remove" class="button button-secondary" type="button" autofocus>取消</button>
        <button id="confirm-remove" class="button button-danger" type="button">移除任务</button>
      </div>
    </dialog>
  </body>
</html>
