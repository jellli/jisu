name: Build

on:
  pull_request:
  push:
    branches: [main, "devin/*-kite-v2-nsgo-ui"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older runs; main and tags
# always finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  extension:
    name: Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test extension/
      - run: zip -r jisu-extension.zip extension/
      - uses: actions/upload-artifact@v7
        with:
          name: jisu-extension
          path: jisu-extension.zip

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  desktop:
    name: Native workspace (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos }
          - { os: windows-latest, target: windows }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the native app
        run: go tool nsgo check
      - name: Exercise the production workspace
        run: go tool nsgo test -target ${{ matrix.target }} -timeout 90s
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kite-workspace-${{ matrix.target }}
          path: .nsgo/test/screenshots/**/*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: windows_x64
            artifact: jisu-windows-x64
            installers: windows-x64-setup.exe
          - name: macOS
            os: macos-latest
            target: macos_arm64,macos_x64
            artifact: jisu-macos
            installers: macos-arm64.dmg macos-x64.dmg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the tag against nsgo.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(awk '$1 == "version:" {print $2}' nsgo.yaml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match nsgo.yaml version $version"
            exit 1
          fi
      - name: Ensure the NSIS compiler is installed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS/makensis.exe"
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path $nsis)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build
        run: go tool nsgo build -target "${{ matrix.target }}"
      - name: Collect the installers
        env:
          INSTALLERS: ${{ matrix.installers }}
        run: |
          version=$(awk '$1 == "version:" {print $2}' nsgo.yaml)
          mkdir -p upload
          for suffix in $INSTALLERS; do
            f="dist/releases/jisu-$version-$suffix"
            if [ ! -f "$f" ]; then
              echo "::error::missing installer $f"
              ls -R dist
              exit 1
            fi
            cp "$f" upload/
          done
          ls -l upload
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: upload/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          pattern: jisu-*
          path: dist
          merge-multiple: true
      - name: Check every platform's installer is there
        run: |
          version=${GITHUB_REF_NAME#v}
          for f in "jisu-$version-windows-x64-setup.exe" "jisu-$version-macos-arm64.dmg" "jisu-$version-macos-x64.dmg"; do
            [ -f "dist/$f" ] || { echo "::error::missing dist/$f"; ls -l dist; exit 1; }
          done
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/<version>/${GITHUB_REF_NAME#v}/g" .github/release-notes.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "jisu $GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file "$RUNNER_TEMP/release-notes.md"
