<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Three isolated Jisu download-row prototypes. Simulated data only; no files are downloaded.">
  <title>极速 · 下载行原型</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2308715e'/%3E%3Cpath d='M32 14v29m-12-12 12 12 12-12M17 50h30' fill='none' stroke='white' stroke-width='5'/%3E%3C/svg%3E">
  <style>
    :root {
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
      --canvas: #eeefef;
      --sidebar: #f7f8f7;
      --surface: #fff;
      --subtle: #f4f5f4;
      --text: #202522;
      --secondary: #535b56;
      --muted: #68716b;
      --border: #d3d8d4;
      --soft-border: #e8ebe8;
      --brand: #08715e;
      --brand-strong: #085d50;
      --danger: #a43d35;
      --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--canvas); }
    h1, h2, h3, p { margin: 0; }
    strong { font-weight: 500; }
    button, input, select { font: inherit; color: inherit; }
    button, select, summary { cursor: pointer; }
    button { -webkit-tap-highlight-color: transparent; }
    button:not(.proto-picker-item):active { transform: scale(.98); }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 4px; }
    .icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .lab { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--sidebar); font-size: 12px; color: var(--secondary); }
    .lab-label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
    .lab-label strong { font-weight: 500; color: var(--text); }
    .lab-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
    .lab-controls label { display: flex; align-items: center; gap: 8px; }
    input { accent-color: var(--text); }
    select { min-height: 32px; border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; background: var(--surface); }
    .frame { max-width: 1600px; margin: 0 auto; padding: 24px 24px 104px; }
    .intro { display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-bottom: 24px; }
    .eyebrow { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    h1 { font-size: 20px; font-weight: 500; line-height: 1.4; }
    .intro p { margin-top: 4px; font-size: 12px; color: var(--secondary); }
    .keys { text-align: right; color: var(--muted); font-size: 12px; flex: none; }
    .keys > div + div { margin-top: 4px; }
    kbd { font: inherit; display: inline-block; min-width: 20px; text-align: center; padding: 0 4px; margin: 0 2px; background: var(--sidebar); border: 1px solid var(--border); border-radius: 4px; }
    .window { border: 1px solid #c7cdc8; border-radius: 12px; background: var(--surface); overflow: hidden; box-shadow: 0 2px 8px #20252208; }
    .titlebar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); background: var(--sidebar); }
    .wordmark { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 16px; font-weight: 600; }
    .wordmark span { color: var(--muted); font-size: 12px; font-weight: 400; }
    .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); }
    .sidebar { display: flex; flex-direction: column; padding: 24px 16px; background: var(--sidebar); border-right: 1px solid var(--soft-border); font-size: 14px; }
    .sidebar-label { padding: 0 12px; margin-bottom: 8px; color: var(--muted); font-size: 12px; }
    .nav-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; line-height: 20px; margin: 2px 0; padding: 8px 12px; border-radius: 4px; color: var(--secondary); }
    .nav-line.current { color: var(--text); background: #e8ebe8; font-weight: 500; }
    .nav-line span:last-child { font-family: var(--mono); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
    .save-location { margin: auto 12px 0; padding-top: 48px; color: var(--muted); font-size: 12px; line-height: 1.7; overflow-wrap: anywhere; }
    .save-location code { display: block; margin-top: 4px; font-family: var(--mono); color: var(--secondary); }
    .save-location p { margin-top: 24px; }
    .workspace { min-width: 0; padding: 24px 32px; }
    .list-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; }
    .list-header h2 { font-size: 20px; font-weight: 500; }
    .list-header p { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .total-speed { text-align: right; font-size: 12px; color: var(--muted); }
    .total-speed strong { display: block; color: var(--text); font-size: 24px; font-weight: 400; }
    .unit { color: var(--secondary); font: 12px var(--mono); }
    .list { display: grid; }
    .row { min-width: 0; padding: 24px 0; border-top: 1px solid var(--soft-border); background: var(--surface); --fill: var(--brand); }
    .file { display: flex; align-items: center; min-width: 0; gap: 12px; }
    .file-icon { display: grid; place-items: center; width: 24px; height: 32px; flex: none; color: var(--muted); }
    .file-copy { min-width: 0; }
    .filename { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-sub { color: var(--muted); font-size: 12px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .state { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--secondary); white-space: nowrap; }
    .state::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
    [data-state="downloading"] .state { color: var(--brand); }
    [data-state="failed"] .state { color: var(--danger); }
    [data-state="paused"], [data-state="failed"] { --fill: #8c9690; }
    [data-state="completed"] { --fill: #a9b1ab; }
    .action { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 32px; padding: 4px 12px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; white-space: nowrap; transition: background 140ms var(--ease-out), transform 120ms var(--ease-out); }
    .primary { background: var(--text); color: var(--surface); border-color: var(--text); }
    .stat { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .row-meta, .connection, .piece-caption { font-variant-numeric: tabular-nums; }
    .progress { height: 4px; border-radius: 2px; background: var(--soft-border); overflow: hidden; }
    .fill { display: block; height: 100%; width: 100%; background: var(--fill, var(--brand)); transform-origin: left; }
    .segment-track { display: flex; gap: 4px; }
    .segment-lane { flex: 1; min-width: 0; }
    .lane-number { display: block; margin-bottom: 4px; color: var(--muted); font: 12px/16px var(--mono); }
    .lane-bar { display: block; height: 8px; background: var(--soft-border); border-radius: 2px; overflow: hidden; }
    .row-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; color: var(--secondary); font-size: 12px; margin-top: 8px; line-height: 20px; }
    .row-meta strong { color: var(--text); font-weight: 500; }
    .details { margin-top: 12px; }
    summary { width: fit-content; color: var(--muted); font-size: 12px; padding: 4px 0; }
    .connection-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 24px; padding: 16px 0 0; }
    .connection { min-width: 0; }
    .connection-head { display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 12px; color: var(--secondary); margin-bottom: 8px; }
    .connection-head > span:first-child { color: var(--muted); }
    .connection small { display: block; margin-top: 8px; font: 12px/16px var(--mono); color: var(--muted); }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: 12px; margin-top: 16px; }
    .legend span { display: flex; gap: 8px; align-items: center; }
    .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--fill, var(--brand)); }
    .swatch.empty { background: var(--soft-border); border: 1px solid var(--border); }
    .footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--muted); padding-top: 16px; border-top: 1px solid var(--soft-border); }
    .rationale { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 24px; margin-top: 16px; color: var(--secondary); font-size: 12px; }
    .rationale strong { font-weight: 500; color: var(--text); }
    .rail .row { padding: 16px 0; }
    .rail-top { display: grid; grid-template-columns: minmax(0, 1fr) 80px 96px; gap: 16px; align-items: center; }
    .rail .rail-progress { padding-left: 36px; margin-top: 8px; }
    .rail .details { margin-left: 36px; margin-top: 4px; }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .card-actions { display: flex; align-items: center; gap: 16px; }
    .mosaic-body { display: grid; grid-template-columns: minmax(0, 1fr) 144px; align-items: center; gap: 32px; margin-top: 20px; }
    .piece-map { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .piece-line { min-width: 0; }
    .piece-caption { display: flex; justify-content: space-between; gap: 4px; color: var(--muted); font: 12px/16px var(--mono); margin-bottom: 8px; }
    .pieces { display: flex; gap: 2px; height: 12px; }
    .piece { flex: 1; min-width: 0; background: var(--soft-border); }
    .piece.done { background: var(--fill, var(--brand)); }
    .piece.partial { background: var(--fill, var(--brand)); opacity: .4; }
    .mosaic-value { border-left: 1px solid var(--soft-border); padding-left: 24px; }
    .percent { font-size: 32px; font-weight: 400; line-height: 1.25; }
    .percent small { font-size: 16px; margin-left: 4px; color: var(--muted); }
    .mosaic-value .row-meta { display: grid; margin-top: 8px; gap: 4px; }
    .focus-main { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin: 16px 0; }
    .focus .progress { height: 8px; }
    .status-line { color: var(--muted); font-size: 12px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    @media (hover: hover) and (pointer: fine) {
      .action:hover { background: var(--subtle); }
      .primary:hover { background: #3d4840; }
      summary:hover { color: var(--text); }
    }
    @media (max-width: 1200px) {
      .app { grid-template-columns: 240px minmax(0, 1fr); }
      .workspace { padding: 24px; }
      .piece-map { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .mosaic-body { gap: 24px; grid-template-columns: minmax(0, 1fr) 128px; }
      .mosaic-value { padding-left: 16px; }
    }
    @media (max-width: 1000px) {
      .app { grid-template-columns: minmax(0, 1fr); }
      .sidebar { display: none; }
      .piece-map { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 660px) {
      .lab { padding: 12px 16px; }
      .lab-label > span { display: none; }
      .lab-controls { gap: 12px; }
      .frame { padding: 16px 8px 104px; }
      .intro { padding: 0 8px; margin-bottom: 16px; }
      .intro p { max-width: 32ch; }
      .keys { display: none; }
      .window { border-radius: 8px; }
      .workspace { padding: 20px 12px; }
      .titlebar { padding: 12px 16px; }
      .titlebar > span { display: none; }
      .list-header { gap: 8px; }
      .list-header h2 { font-size: 18px; }
      .total-speed strong { font-size: 20px; }
      .rail-top { grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
      .rail-top > .state { grid-column: 1; padding-left: 36px; }
      .rail-top > .action { grid-column: 2; grid-row: 1 / 3; padding: 4px 8px; }
      .rail .rail-progress { padding-left: 0; margin-top: 12px; }
      .rail .details { margin-left: 0; }
      .card-head { flex-wrap: wrap; gap: 12px; }
      .card-head > .file { flex: 1 1 100%; }
      .card-actions { width: 100%; justify-content: space-between; }
      .focus .card-head > .action { margin-left: 36px; }
      .connection-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .mosaic-body { grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 16px; }
      .mosaic-value { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; border-left: 0; padding-left: 0; }
      .mosaic-value .row-meta { margin-top: 0; text-align: right; }
      .piece-map { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .focus-main { flex-wrap: wrap; gap: 8px; margin: 12px 0; }
      .rationale { padding: 0 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .action { transition: none; }
      button:not(.proto-picker-item):active { transform: none; }
    }
    /* The picker is intentionally independent of the product tokens. */
    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
    }
    /* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }
    .proto-picker-item {
      position: relative; /* sits above the highlight */
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition:
        color 150ms ease-out,
        transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    @media (hover: hover) and (pointer: fine) {
      .proto-picker-item:hover {
        color: rgba(255, 255, 255, 0.85);
      }
    }
    .proto-picker-item:active {
      transform: scale(0.97);
    }
    .proto-picker-item:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }
    .proto-picker-item[data-active] {
      color: #fff;
    }
    .proto-picker-divider {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.12);
    }
    .proto-picker-replay {
      padding: 0 10px;
      font-size: 14px;
    }
    .proto-picker[data-position="top"] {
      bottom: auto;
      top: 24px;
    }
  </style>
</head>
<body>
  <header class="lab">
    <div class="lab-label"><strong>Jisu · 下载行原型</strong><span>仅模拟数据，不会下载文件</span></div>
    <div class="lab-controls">
      <label>首行状态 <select id="scenario"><option value="downloading">下载中</option><option value="paused">已暂停</option><option value="failed">连接中断</option><option value="completed">已完成</option></select></label>
      <label><input type="checkbox" id="simulate" checked> 模拟传输</label>
    </div>
  </header>
  <main id="stage"></main>
  <p id="announcement" class="sr-only" role="status"></p>
  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Rail</button>
    <button class="proto-picker-item">Mosaic</button>
    <button class="proto-picker-item">Focus</button>
  </nav>
  <noscript>请启用 JavaScript 以切换和操作原型。</noscript>
  <script>
    const paths = {
      file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6"/>',
      download: '<path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/>',
      pause: '<path d="M9 5v14m6-14v14"/>',
      play: '<path d="m8 5 11 7-11 7z"/>',
      retry: '<path d="M20 10a8 8 0 1 0-1 7M20 5v5h-5"/>',
      check: '<path d="m5 12 4 4L19 6"/>'
    };
    const icon = name => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`;
    const labels = { downloading: '下载中', paused: '已暂停', failed: '连接中断', completed: '已完成' };
    const baseSegments = [1, .78, .36, .90, .55, .48, .67, .30];
    const rates = [0, 2.8, 2.3, 3.2, 2.7, 2.1, 2.5, 2.8];
    const directions = [
      { name: 'Rail', number: '1', title: '紧凑下载列表', description: '八路进度常驻，连接速率按需展开', strength: '分段进度常驻，适合同时查看多个下载', cost: '连接速率需要展开', className: 'rail' },
      { name: 'Mosaic', number: '2', title: '分段连接地图', description: '每路连接的已接收区块与当前速率', strength: '直接比较八路连接的传输情况', cost: '任务占用更多高度', className: 'mosaic' },
      { name: 'Focus', number: '3', title: '总进度与剩余时间', description: '先查看下载结果，再展开分段连接', strength: '总进度优先，连接详情按需展开', cost: '默认不显示分段差异', className: 'focus' }
    ];
    let tasks = [];
    let direction = 0;
    const scenario = document.getElementById('scenario');
    const simulate = document.getElementById('simulate');
    function resetTasks() {
      tasks = [
        { name: 'ubuntu-24.04.1-desktop-amd64.iso', source: 'releases.ubuntu.com', ext: 'ISO', size: 6100, state: scenario.value, segments: [...baseSegments] },
        { name: 'Blender-4.3.2-macos-arm64.dmg', source: 'download.blender.org', ext: 'DMG', size: 384, state: 'paused', segments: [.92, .6, .27, .51, .38, .7, .29, .41] },
        { name: 'Figma-Design-Assets-2026.zip', source: 'design-assets.example.com', ext: 'ZIP', size: 128, state: 'completed', segments: Array(8).fill(1) }
      ];
      if (scenario.value === 'completed') tasks[0].segments.fill(1);
    }
    function progress(task) { return task.segments.reduce((a, b) => a + b, 0) / task.segments.length; }
    function rate(task, n) { return task.state === 'downloading' && task.segments[n] < 1 ? rates[n] || 2.4 : 0; }
    function speed(task) { return task.segments.reduce((sum, _, n) => sum + rate(task, n), 0); }
    function bytes(value) { return value >= 1000 ? `${(value / 1000).toFixed(2)} GB` : `${value.toFixed(0)} MB`; }
    function remaining(task) {
      if (task.state === 'completed') return '传输完成';
      if (task.state === 'paused') return '等待继续';
      if (task.state === 'failed') return '等待重试';
      const seconds = Math.ceil(task.size * (1 - progress(task)) / speed(task));
      return seconds >= 60 ? `约 ${Math.floor(seconds / 60)} 分 ${seconds % 60} 秒` : `约 ${seconds} 秒`;
    }
    function file(task) {
      return `<div class="file"><span class="file-icon" aria-hidden="true">${icon('file')}</span><div class="file-copy"><h3 class="filename" title="${task.name}">${task.name}</h3><p class="file-sub">${task.source} <span aria-hidden="true">·</span> ${bytes(task.size)} <span aria-hidden="true">·</span> ${task.ext}</p></div></div>`;
    }
    function state(task) { return `<span class="state" data-status>${labels[task.state]}</span>`; }
    function action(task, index) {
      const name = task.state === 'downloading' ? '暂停' : task.state === 'completed' ? '查看详情' : task.state === 'failed' ? '重试' : '继续';
      const glyph = task.state === 'downloading' ? 'pause' : task.state === 'completed' ? 'check' : task.state === 'failed' ? 'retry' : 'play';
      return `<button class="action ${index === 0 ? 'primary' : ''}" data-action="${index}" aria-label="${name} ${task.name}">${icon(glyph)}<span>${name}</span></button>`;
    }
    function track(task, index, big = false) {
      if (big) return `<div class="progress" role="progressbar" aria-label="${task.name} 总进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(progress(task) * 100)}" data-progress><span class="fill" data-total style="transform:scaleX(${progress(task)})"></span></div>`;
      return `<div class="segment-track" role="progressbar" aria-label="${task.name} 八路分段总进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(progress(task) * 100)}" data-progress>${task.segments.map((value, n) => `<span class="segment-lane" title="连接 ${n + 1}"><span class="lane-number" aria-hidden="true">${n + 1}</span><span class="lane-bar"><i class="fill" data-segment="${n}" style="transform:scaleX(${value})"></i></span></span>`).join('')}</div>`;
    }
    function connections(task, index, opened = false) {
      return `<details class="details" id="connections-${index}" ${opened ? 'open' : ''}><summary>连接详情 · 8 路并行</summary><div class="connection-grid">${task.segments.map((value, n) => `<div class="connection"><div class="connection-head"><span>连接 ${n + 1}</span><span class="stat" data-connection-percent="${n}">${Math.floor(value * 100)}%</span></div><div class="progress"><span class="fill" data-segment="${n}" style="transform:scaleX(${value})"></span></div><small class="stat" data-connection-rate="${n}">${rate(task, n).toFixed(1)} MB/s</small></div>`).join('')}</div><div class="legend"><span><i class="swatch"></i>已接收</span><span><i class="swatch empty"></i>等待接收</span><span>HTTP Range · 断点保留</span></div></details>`;
    }
    function meta(task, percent = true) {
      return `<div class="row-meta"><span class="stat"><strong data-percent>${Math.floor(progress(task) * 100)}%</strong>${percent ? ' <span aria-hidden="true">·</span> ' : ' ' }<span data-bytes>${bytes(task.size * progress(task))} / ${bytes(task.size)}</span></span><span class="stat"><strong data-speed>${speed(task).toFixed(1)} MB/s</strong> <span aria-hidden="true">·</span> <span data-remaining>${remaining(task)}</span></span></div>`;
    }
    function rail(task, index) {
      return `<article class="row" data-row="${index}" data-state="${task.state}" aria-label="${task.name}"><div class="rail-top">${file(task)}${state(task)}${action(task, index)}</div><div class="rail-progress">${track(task, index)}${meta(task)}</div>${connections(task, index)}</article>`;
    }
    function mosaic(task, index) {
      return `<article class="row" data-row="${index}" data-state="${task.state}" aria-label="${task.name}"><div class="card-head">${file(task)}<div class="card-actions">${state(task)}${action(task, index)}</div></div><div class="mosaic-body"><div class="piece-map" role="group" aria-label="八路连接分块地图">${task.segments.map((value, n) => `<div class="piece-line"><div class="piece-caption"><span>${n + 1}</span><span class="stat" data-connection-rate="${n}">${rate(task, n).toFixed(1)} MB/s</span></div><div class="pieces" role="progressbar" aria-label="连接 ${n + 1}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.floor(value * 100)}" data-piece-progress="${n}">${Array.from({length: 12}, (_, piece) => `<span class="piece ${piece < Math.floor(value * 12) ? 'done' : piece < value * 12 ? 'partial' : ''}" data-piece="${n}:${piece}"></span>`).join('')}</div></div>`).join('')}</div><div class="mosaic-value"><div class="percent stat"><span data-percent>${Math.floor(progress(task) * 100)}</span><small>%</small></div><div class="row-meta"><strong class="stat" data-speed>${speed(task).toFixed(1)} MB/s</strong><span class="stat" data-remaining>${remaining(task)}</span></div></div></div><div class="row-meta"><span class="stat" data-bytes>${bytes(task.size * progress(task))} / ${bytes(task.size)}</span><span>8 连接 · 每格代表该段的 1/12</span></div>${connections(task, index)}</article>`;
    }
    function focus(task, index) {
      return `<article class="row" data-row="${index}" data-state="${task.state}" aria-label="${task.name}"><div class="card-head">${file(task)}${action(task, index)}</div><div class="focus-main"><div class="percent stat"><span data-percent>${Math.floor(progress(task) * 100)}</span><small>%</small></div><div class="status-line">${state(task)} <span aria-hidden="true">·</span> <span class="stat" data-remaining>${remaining(task)}</span></div></div>${track(task, index, true)}<div class="row-meta"><span class="stat" data-bytes>${bytes(task.size * progress(task))} / ${bytes(task.size)}</span><strong class="stat" data-speed>${speed(task).toFixed(1)} MB/s</strong></div>${connections(task, index)}</article>`;
    }
    function renderVariant(n) {
      direction = n;
      resetTasks();
      const d = directions[n];
      const row = [rail, mosaic, focus][n];
      const count = state => tasks.filter(task => task.state === state).length;
      const total = tasks.reduce((sum, task) => sum + speed(task), 0).toFixed(1);
      return `<div class="frame ${d.className}">
        <header class="intro">
          <div><div class="eyebrow">下载行比较 · ${d.number}/3 · ${d.name}</div><h1>${d.title}</h1><p>${d.description}</p></div>
          <div class="keys"><div><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 切换方案</div><div><kbd>←</kbd><kbd>→</kbd> 对比 <span aria-hidden="true">·</span> <kbd>R</kbd> 重置</div></div>
        </header>
        <section class="window" aria-label="Jisu 下载中心原型">
          <div class="titlebar"><div class="wordmark">${icon('download')} 极速 <span>Jisu</span></div><span>下载管理</span></div>
          <div class="app">
            <aside class="sidebar" aria-label="界面上下文（静态）">
              <p class="sidebar-label">下载管理</p>
              <div class="nav-line current"><span>全部任务</span><span>${tasks.length}</span></div>
              <div class="nav-line"><span>下载中</span><span data-count="downloading">${count('downloading')}</span></div>
              <div class="nav-line"><span>已暂停</span><span data-count="paused">${count('paused')}</span></div>
              <div class="nav-line"><span>已完成</span><span data-count="completed">${count('completed')}</span></div>
              <div class="save-location">默认保存位置<code>~/Downloads</code><p>界面上下文 · 非功能导航</p></div>
            </aside>
            <div class="workspace">
              <div class="list-header">
                <div><h2>全部下载</h2><p>${tasks.length} 个任务 <span aria-hidden="true">·</span> 8 路并行连接</p></div>
                <div class="total-speed"><strong class="stat" data-total-speed>${total} <span class="unit">MB/s</span></strong>总下载速度</div>
              </div>
              <div class="list">${tasks.map(row).join('')}</div>
              <footer class="footer"><span>HTTP Range · 可恢复传输</span><span>模拟数据，不连接下载引擎</span></footer>
            </div>
          </div>
        </section>
        <footer class="rationale"><span><strong>${d.name}</strong> — ${d.strength}</span><span>取舍：${d.cost}</span></footer>
      </div>`;
    }
    const variants = [() => renderVariant(0), () => renderVariant(1), () => renderVariant(2)];

    // Validate around the verbatim picker reference to meet its stricter contract.
    const initialUrl = new URL(location);
    const initialVariant = initialUrl.searchParams.get('v');
    if (initialVariant !== null && (!/^[1-9]\d*$/.test(initialVariant) || Number(initialVariant) > variants.length)) {
      initialUrl.searchParams.delete('v');
      history.replaceState(null, '', initialUrl);
    }
    document.addEventListener('keydown', event => {
      if (event.shiftKey && /^(?:[1-9]|ArrowLeft|ArrowRight|r|R)$/.test(event.key)) event.stopImmediatePropagation();
    }, true);

    // `variants` is an array of render functions, one per variant, in picker order.
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      // Clear first, render next frame, so entrance animations re-run.
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    const requested = parseInt(new URLSearchParams(location.search).get('v'), 10);
    setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
    // Enable the slide only after first paint, so load doesn't animate.
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));

    function updateReadouts() {
      stage.querySelectorAll('[data-row]').forEach(row => {
        const task = tasks[Number(row.dataset.row)];
        row.dataset.state = task.state;
        row.querySelector('[data-status]').textContent = labels[task.state];
        row.querySelectorAll('[data-percent]').forEach(el => el.textContent = `${Math.floor(progress(task) * 100)}${direction === 0 ? '%' : ''}`);
        row.querySelectorAll('[data-bytes]').forEach(el => el.textContent = `${bytes(task.size * progress(task))} / ${bytes(task.size)}`);
        row.querySelectorAll('[data-speed]').forEach(el => el.textContent = `${speed(task).toFixed(1)} MB/s`);
        row.querySelectorAll('[data-remaining]').forEach(el => el.textContent = remaining(task));
        row.querySelectorAll('[data-segment]').forEach(el => el.style.transform = `scaleX(${task.segments[Number(el.dataset.segment)]})`);
        row.querySelectorAll('[data-total]').forEach(el => el.style.transform = `scaleX(${progress(task)})`);
        row.querySelectorAll('[data-progress]').forEach(el => el.setAttribute('aria-valuenow', Math.floor(progress(task) * 100)));
        row.querySelectorAll('[data-connection-percent]').forEach(el => el.textContent = `${Math.floor(task.segments[Number(el.dataset.connectionPercent)] * 100)}%`);
        row.querySelectorAll('[data-connection-rate]').forEach(el => el.textContent = `${rate(task, Number(el.dataset.connectionRate)).toFixed(1)} MB/s`);
        row.querySelectorAll('[data-piece-progress]').forEach(el => el.setAttribute('aria-valuenow', Math.floor(task.segments[Number(el.dataset.pieceProgress)] * 100)));
        row.querySelectorAll('[data-piece]').forEach(el => {
          const [n, piece] = el.dataset.piece.split(':').map(Number);
          const filled = task.segments[n] * 12;
          el.classList.toggle('done', piece < Math.floor(filled));
          el.classList.toggle('partial', piece >= Math.floor(filled) && piece < filled);
        });
        const button = row.querySelector('[data-action]');
        const next = document.createElement('template');
        next.innerHTML = action(task, Number(row.dataset.row));
        button.innerHTML = next.content.firstElementChild.innerHTML;
        button.setAttribute('aria-label', next.content.firstElementChild.getAttribute('aria-label'));
      });
      const total = tasks.reduce((sum, task) => sum + speed(task), 0).toFixed(1);
      const totalEl = stage.querySelector('[data-total-speed]');
      if (totalEl) totalEl.innerHTML = `${total} <span class="unit">MB/s</span>`;
      stage.querySelectorAll('[data-count]').forEach(el => el.textContent = tasks.filter(task => task.state === el.dataset.count).length);
    }
    stage.addEventListener('click', event => {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const index = Number(button.dataset.action);
      const task = tasks[index];
      if (task.state === 'completed') {
        const details = document.getElementById(`connections-${index}`);
        details.open = !details.open;
        if (details.open) details.querySelector('summary').focus();
        return;
      }
      task.state = task.state === 'downloading' ? 'paused' : 'downloading';
      if (index === 0) scenario.value = task.state;
      updateReadouts();
      document.getElementById('announcement').textContent = `${task.name}：${labels[task.state]}`;
    });
    scenario.addEventListener('change', () => {
      const task = tasks[0];
      task.state = scenario.value;
      task.segments = scenario.value === 'completed' ? Array(8).fill(1) : [...baseSegments];
      updateReadouts();
      document.getElementById('announcement').textContent = `首行状态：${labels[task.state]}`;
    });
    setInterval(() => {
      if (!simulate.checked || document.hidden) return;
      tasks.forEach((task, index) => {
        if (task.state !== 'downloading') return;
        task.segments = task.segments.map((value, n) => Math.min(1, value + rate(task, n) / (task.size / 8)));
        if (task.segments.every(value => value === 1)) {
          task.state = 'completed';
          if (index === 0) scenario.value = 'completed';
          document.getElementById('announcement').textContent = `${task.name} 下载完成`;
        }
      });
      updateReadouts();
    }, 1000);
  </script>
</body>
</html>
